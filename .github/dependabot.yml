version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Maven (Root)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Maven (Backend)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Maintain dependencies for pnpm (Frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
