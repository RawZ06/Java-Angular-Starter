name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    uses: Rawz06-Studio/.github/.github/workflows/maven-ci.yml@main
    with:
      java_version: '25'
    secrets: inherit

  frontend-ci:
    uses: Rawz06-Studio/.github/.github/workflows/node-ci.yml@main
    with:
      node_version: '24' # Based on node.version in frontend/pom.xml
    secrets: inherit

  docker-build-push:
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Rawz06-Studio/.github/.github/workflows/docker-build-push.yml@main
    with:
      image_name: 'starter-simple-java'
      # dokploy_app_id: 'your-id-here' # Optional, can be added by user
    secrets: inherit
