name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  global-ci:
    uses: Rawz06-Studio/.github/.github/workflows/maven-ci.yml@main
    with:
      java_version: '25'
    secrets: inherit

  docker-build-push:
    needs: [global-ci]
    uses: Rawz06-Studio/.github/.github/workflows/docker-build-push.yml@main
    with:
      image_name: 'starter-simple-java'
      # dokploy_app_id: 'your-id-here' # Optional, can be added by user
    secrets: inherit
